[project]
name = "turntable"
version = "0.1.0"
description = "Blocked-Gibbs global-fit orchestration for LISA: the Wheel/Segment/Residuals protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Aaron Johnson", email = "aaron9035@gmail.com" },
]
# Floor set by lisaorbits>=3.0.3 (needs >=3.12); core itself only needs numpy.
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1",
]

[project.urls]
Repository = "https://github.com/AaronDJohnson/turntable"
Issues = "https://github.com/AaronDJohnson/turntable/issues"

[project.optional-dependencies]
numeric-orbits = [
    "h5py>=3.16.0",
    "lisaorbits>=3.0.3",
    "scipy>=1.17.1",
]
examples = [
    "jupyterlab>=4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/turntable"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    # Protocol method bodies are `...` and never execute
    '^\s*\.\.\.$',
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Integration notebooks legitimately use notebook idioms: a warnings filter
# before imports, imports next to the cell that needs them, and
# semicolon-joined plotting calls. Lint the .py modules strictly instead.
"examples/*.ipynb" = ["E402", "E702", "I001"]
