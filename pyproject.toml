[project]
name = "turntable"
version = "0.1.0"
description = "Blocked-Gibbs global-fit orchestration for LISA: the Wheel/Segment/Residuals protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Aaron Johnson", email = "aaron9035@gmail.com" },
]
# Floor set by lisaorbits>=3.0.3 (needs >=3.12); core itself only needs numpy.
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1",
]

[project.urls]
Repository = "https://github.com/AaronDJohnson/turntable"
Issues = "https://github.com/AaronDJohnson/turntable/issues"

[project.optional-dependencies]
numeric-orbits = [
    "h5py>=3.16.0",
    "lisaorbits>=3.0.3",
    "scipy>=1.17.1",
]
examples = [
    "jupyterlab>=4",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/turntable"]
python_version = "3.12"

[[tool.mypy.overrides]]
# scipy and h5py ship no type information; they are lazily imported behind the
# numeric-orbits extra and their use here is narrow.
module = ["scipy.*", "h5py.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/turntable"]
branch = true

[tool.coverage.report]
show_missing = true
# coverage's own defaults already exclude `...` bodies and `if TYPE_CHECKING:`;
# only add what they miss.
exclude_also = ["raise NotImplementedError"]
fail_under = 95

[tool.ruff]
line-length = 88
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks group imports per cell rather than in one sorted block at the top.
# Only I001 actually fires; do not broaden this without checking, so real
# problems in notebook cells still surface.
"examples/*.ipynb" = ["I001"]
