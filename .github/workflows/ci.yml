name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Full gate: lint, format, types, tests behind the coverage gate, build, and a
  # smoke test of the artifact that actually gets published.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # pinned to an exact release: setup-uv publishes v9.0.0 but no floating v9
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (locked, with extras and dev group)
        # --locked fails fast if uv.lock has drifted from pyproject.toml, so CI
        # never passes against a resolution contributors do not get locally
        run: uv sync --locked --extra numeric-orbits
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Format
        run: uv run ruff format --check src tests examples
      - name: Type-check
        # enchilada ships py.typed, so its annotations are load-bearing for
        # consumers' type checkers -- validate them here
        run: uv run mypy
      - name: Test (with coverage gate)
        run: uv run pytest -q --cov --cov-report=term-missing
      - name: Build artifacts
        run: uv build
      - name: Smoke-test the built wheel
        # proves the artifact is importable and actually carries py.typed --
        # `uv build` alone only proves the build did not crash
        run: |
          uv run --no-project --isolated --with dist/*.whl python -c "
          import importlib.resources as r, enchilada
          print('version:', enchilada.__version__)
          assert r.files('enchilada').joinpath('py.typed').is_file(), 'py.typed missing'
          print('py.typed present in installed wheel')
          "

  # The core is numpy-only by design. Prove that on every supported interpreter,
  # including 3.14 (which the LISA dev stack runs) where the optional
  # numeric-orbits deps may not have wheels yet -- those tests soft-skip.
  core-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core only (no extras)
        run: uv sync --no-extra numeric-orbits
      - name: Test (no coverage gate -- orbit tests skip without scipy)
        run: uv run pytest -q

  # Dependency floors are a claim; resolve to them and run the suite so they are
  # a tested claim.
  floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Resolve to the declared lower bounds
        run: uv sync --resolution lowest-direct --extra numeric-orbits
      - name: Test
        run: uv run pytest -q

  # The sdist claims to be self-testing (source-include ships tests/ and
  # examples/). Downstream packagers build from it, so prove the claim: unpack
  # the archive and run the suite from *that tree only*, never the checkout.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Build the sdist
        run: uv build --sdist
      - name: Unpack somewhere the checkout cannot be picked up
        run: |
          mkdir -p "$RUNNER_TEMP/from-sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/from-sdist" --strip-components=1
          ls "$RUNNER_TEMP/from-sdist"
      - name: Run the packaged suite against the packaged source
        working-directory: ${{ runner.temp }}/from-sdist
        run: |
          uv sync --extra numeric-orbits
          uv run pytest -q
