name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with extras and dev group)
        run: uv sync --extra numeric-orbits
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Test
        run: uv run pytest -q
      - name: Build artifacts
        run: uv build
