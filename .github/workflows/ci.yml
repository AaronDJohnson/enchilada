name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      # pinned to an exact release: setup-uv publishes v9.0.0 but no floating v9
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with extras and dev group)
        run: uv sync --extra numeric-orbits
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Test (with coverage gate)
        run: uv run pytest -q --cov --cov-report=term-missing --cov-fail-under=95
      - name: Build artifacts
        run: uv build
