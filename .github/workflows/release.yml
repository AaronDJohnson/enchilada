name: Release

# Tag-triggered publish. Nothing is uploaded from a laptop: the artifacts PyPI
# receives are built here, from the tagged commit, after the same gate CI runs.
# workflow_dispatch builds and gates without publishing, so the pipeline can be
# rehearsed before a tag exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.1"

# A re-pushed tag must not race the run it replaces onto PyPI.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run the runtime gates here and test the packaged source in the build job.
  gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra numeric-orbits
      - run: uv run --no-sync ruff check src tests examples benchmarks
      - run: uv run --no-sync ruff format --check src tests examples benchmarks
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q --cov

  core-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --no-extra numeric-orbits
      - run: uv run --no-sync pytest -q

  core-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      # uv sync also resolves extras, allowing lisaorbits to raise the floor.
      - name: Install the core at its NumPy floor
        run: |
          uv venv --python 3.12
          uv pip install --only-binary numpy --group dev -e . "numpy==1.26.4"
      - name: Verify the tested dependency boundary
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util
          import numpy

          assert numpy.__version__ == "1.26.4", numpy.__version__
          for name in ("scipy", "h5py", "lisaorbits", "wdm"):
              assert importlib.util.find_spec(name) is None, name
          print("core minimum: NumPy", numpy.__version__)
          PY
      - run: uv run --no-sync pytest -q

  floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --resolution lowest-direct --extra numeric-orbits
      # Keep the environment resolved above instead of re-locking with highest.
      - run: uv run --no-sync pytest -q

  wdm:
    uses: ./.github/workflows/wdm.yml

  build:
    needs: [gate, core-only, core-minimum, floors, wdm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Tag must match the project version
        # otherwise a v0.2.0 tag could publish 0.1.0 bytes, and the name on PyPI
        # would say nothing about which commit produced them. Compared as parsed
        # versions, not strings, so a v0.2.0-rc1 tag matches version "0.2.0rc1"
        # -- PyPI normalizes them to the same release either way.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv run --no-project --with packaging python - "${GITHUB_REF_NAME#v}" <<'PY'
          import sys, tomllib
          from packaging.version import InvalidVersion, Version

          proj = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          try:
              tag = Version(sys.argv[1])
          except InvalidVersion:
              sys.exit(f"::error::tag {sys.argv[1]!r} is not a valid version")
          print(f"tag={tag} project={proj}")
          if tag != Version(proj):
              sys.exit(f"::error::tag {tag} does not match project version {proj}")
          if tag.is_prerelease:
              print("::notice::pre-release; PyPI will not serve it as the default")
          PY
      - run: uv build --force-pep517
      - name: Smoke-test the wheel that will be published
        run: |
          uv run --no-project --isolated --with dist/*.whl python -c "
          import importlib.resources as r, enchilada
          assert r.files('enchilada').joinpath('py.typed').is_file()
          print('publishing version', enchilada.__version__)
          "
      - name: Unpack the source archive that will be published
        run: |
          mkdir -p "$RUNNER_TEMP/from-sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/from-sdist" --strip-components=1
      - name: Test the packaged source before publication
        working-directory: ${{ runner.temp }}/from-sdist
        run: |
          uv sync --extra numeric-orbits
          uv run --no-sync pytest -q
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Manual runs, including dispatches against a tag, stop after build.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Configure this environment on PyPI as a Trusted Publisher, then no
    # long-lived API token ever exists to leak.
    environment:
      name: pypi
      url: https://pypi.org/p/enchilada
    permissions:
      id-token: write # OIDC for trusted publishing (the only extra scope needed)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Publish to PyPI (trusted publishing, no token)
        # --check-url makes a re-run of an already-published version a no-op
        # instead of a hard 400, so a retried job is safe
        run: |
          uv publish --trusted-publishing always \
            --check-url https://pypi.org/simple/enchilada/
